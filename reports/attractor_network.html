var c=document.getElementById("c"), ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize(); window.addEventListener("resize",resize);
var cx=c.width/2, cy=c.height/2;

var pos=[], vel=[];
for(var i=0;i<nodes.length;i++){
    var a=Math.random()*Math.PI*2, r=Math.min(cx,cy)*0.5*Math.random();
    pos.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r});
    vel.push({x:0,y:0});
}
var nm={}; for(var i=0;i<nodes.length;i++) nm[nodes[i].id]=i;

function sim(iters){
    for(var iter=0;iter<iters;iter++){
        for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
            var dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y;
            var d=Math.max(1,Math.sqrt(dx*dx+dy*dy)), f=600/(d*d);
            vel[i].x+=dx/d*f; vel[i].y+=dy/d*f;
            vel[j].x-=dx/d*f; vel[j].y-=dy/d*f;
        }
        edges.forEach(function(e){
            var si=nm[e.s], ti=nm[e.t];
            if(si===undefined||ti===undefined)return;
            var dx=pos[ti].x-pos[si].x, dy=pos[ti].y-pos[si].y;
            var d=Math.sqrt(dx*dx+dy*dy), f=d*0.004*(1+e.strength);
            vel[si].x+=dx/d*f; vel[si].y+=dy/d*f;
            vel[ti].x-=dx/d*f; vel[ti].y-=dy/d*f;
        });
        for(var i=0;i<nodes.length;i++){
            vel[i].x+=(cx-pos[i].x)*0.0008; vel[i].y+=(cy-pos[i].y)*0.0008;
            pos[i].x+=vel[i].x*0.12; pos[i].y+=vel[i].y*0.12;
            vel[i].x*=0.80; vel[i].y*=0.80;
        }
    }
}

var cam={x:0,y:0,z:1}, drag=false, pm={x:0,y:0};
c.addEventListener("mousedown",function(e){drag=true;pm.x=e.clientX;pm.y=e.clientY});
c.addEventListener("mouseup",function(){drag=false});
c.addEventListener("mousemove",function(e){
    if(!drag){updateHover(e);return}
    cam.x+=(e.clientX-pm.x); cam.y+=(e.clientY-pm.y);
    pm.x=e.clientX; pm.y=e.clientY;
});
c.addEventListener("wheel",function(e){cam.z=Math.max(0.2,Math.min(4,cam.z-e.deltaY*0.002));e.preventDefault()});

sim(40);

function project(px,py){
    return {x:(px+cam.x)*cam.z+c.width/2*(1-cam.z), y:(py+cam.y)*cam.z+c.height/2*(1-cam.z), s:cam.z};
}

function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    var bg=ctx.createRadialGradient(cx,cy,0,cx,cy,c.width*1.2);
    bg.addColorStop(0,"#0d0d28"); bg.addColorStop(1,"#04040e");
    ctx.fillStyle=bg; ctx.fillRect(0,0,c.width,c.height);
    
    edges.forEach(function(e){
        var si=nm[e.s], ti=nm[e.t];
        if(si===undefined||ti===undefined)return;
        var a=project(pos[si].x,pos[si].y), b=project(pos[ti].x,pos[ti].y);
        ctx.globalAlpha=Math.min(0.5, 0.03+e.strength*0.5);
        ctx.strokeStyle=e.strength>0.5?"#8899bb":"#334455";
        ctx.lineWidth=0.2+e.strength*0.8;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    });
    ctx.globalAlpha=1;
    
    nodes.forEach(function(n,i){
        var p=project(pos[i].x,pos[i].y);
        var r=Math.max(2, 3+n.pop*0.2+n.s*3)*p.s;
        if(n.monopoly){
            ctx.beginPath(); ctx.arc(p.x,p.y,r+4,0,Math.PI*2);
            ctx.fillStyle="rgba(255,100,68,0.15)"; ctx.fill();
        }
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fillStyle=n.color; ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,0.12)"; ctx.lineWidth=0.3; ctx.stroke();
    });
    
    // Labels top 30
    ctx.font=(10*cam.z)+"px monospace"; ctx.fillStyle="#8899aa";
    var sorted=nodes.map(function(n,i){return{n:n,i:i}}).sort(function(a,b){return (b.n.pop+b.n.s*10)-(a.n.pop+a.n.s*10)});
    for(var k=0;k<30;k++){
        if(sorted[k].n.pop<3&&sorted[k].n.s<0.1)break;
        var i=sorted[k].i, p=project(pos[i].x,pos[i].y);
        ctx.fillText(sorted[k].n.id.substring(0,20), p.x+6, p.y+3);
    }
    
    requestAnimationFrame(draw);
}

var tip=document.getElementById("tip");
var projected=[];
function updateHover(e){
    var best=null,bd=20;
    for(var i=0;i<projected.length;i++){
        var p=projected[i], dx=p.x-e.clientX, dy=p.y-e.clientY, d=Math.sqrt(dx*dx+dy*dy);
        if(d<bd){bd=d;best=p;}
    }
    if(best){
        tip.style.opacity=1;
        tip.textContent=best.n.id+" | pop:"+best.n.pop+" | s:"+best.n.s+" | "+best.n.domain+(best.n.monopoly?" [标记垄断]":"");
    }else tip.style.opacity=0;
    projected=[];
}

var _draw=draw;
draw=function(){
    projected=nodes.map(function(n,i){var p=project(pos[i].x,pos[i].y);return{n:n,x:p.x,y:p.y}});
    _draw();
};

draw();
