  nodes.push({id:n.id,domain:n.domain,depth:n.depth,color:n.color,size:n.size,pop:n.pop,deg:n.deg,
    x:(Math.random()-0.5)*spread, y:y, z:(Math.random()-0.5)*spread, vx:0,vy:0,vz:0});
});
for(var iter=0;iter<12;iter++){
  for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
    var dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, dz=nodes[i].z-nodes[j].z;
    var d=Math.max(1,Math.sqrt(dx*dx+dy*dy+dz*dz)), ff=200/(d*d);
    nodes[i].vx+=dx/d*ff; nodes[i].vy+=dy/d*ff; nodes[i].vz+=dz/d*ff;
    nodes[j].vx-=dx/d*ff; nodes[j].vy-=dy/d*ff; nodes[j].vz-=dz/d*ff;
  }
  E.forEach(function(e){
    var si=nm[e.s],ti=nm[e.t]; if(si===undefined||ti===undefined)return;
    var dx=nodes[ti].x-nodes[si].x,dy=nodes[ti].y-nodes[si].y,dz=nodes[ti].z-nodes[si].z;
    var d=Math.sqrt(dx*dx+dy*dy+dz*dz), ff=d*0.002*(1+e.strength/200);
    nodes[si].vx+=dx/d*ff; nodes[si].vy+=dy/d*ff; nodes[si].vz+=dz/d*ff;
    nodes[ti].vx-=dx/d*ff; nodes[ti].vy-=dy/d*ff; nodes[ti].vz-=dz/d*ff;
  });
  for(var i=0;i<nodes.length;i++){
    var ty=(nodes[i].depth-MAX_D/2)*25;
    nodes[i].vy+=(ty-nodes[i].y)*0.15;
    nodes[i].x+=nodes[i].vx*0.06; nodes[i].y+=nodes[i].vy*0.06; nodes[i].z+=nodes[i].vz*0.06;
    nodes[i].vx*=0.85; nodes[i].vy*=0.85; nodes[i].vz*=0.85;
  }
}
var cam={x:0,y:0,z:1.0,rotX:0.3,rotY:0}, drag=false, pm={x:0,y:0};
c.addEventListener("mousedown",function(e){drag=true;pm.x=e.clientX;pm.y=e.clientY});
c.addEventListener("mouseup",function(){drag=false});
c.addEventListener("mousemove",function(e){
  if(!drag){updateHover(e);return}
  cam.rotY+=(e.clientX-pm.x)*0.005; cam.rotX-=(e.clientY-pm.y)*0.005;
  cam.rotX=Math.max(-1.2,Math.min(1.2,cam.rotX)); pm.x=e.clientX; pm.y=e.clientY;
});
c.addEventListener("wheel",function(e){cam.z=Math.max(0.03,Math.min(2.0,cam.z-e.deltaY*0.001));e.preventDefault()});
function project(x,y,z){
  var cosY=Math.cos(cam.rotY),sinY=Math.sin(cam.rotY),cosX=Math.cos(cam.rotX),sinX=Math.sin(cam.rotX);
  var rx=x*cosY-z*sinY, rz=x*sinY+z*cosY, ry=y*cosX-rz*sinX, rz2=y*sinX+rz*cosX;
  var scale=cam.z;
  return {x:c.width/2+rx*scale, y:c.height/2-ry*scale, s:scale};
}
function toR(c){var r=(c>>16)&0xff,g=(c>>8)&0xff,b=c&0xff;return "rgb("+r+","+g+","+b+")"}
function toRA(c,a){var r=(c>>16)&0xff,g=(c>>8)&0xff,b=c&0xff;return "rgba("+r+","+g+","+b+","+a+")"}
function render(){
  ctx.clearRect(0,0,c.width,c.height);
  var bg=ctx.createRadialGradient(c.width/2,c.height/2,0,c.width/2,c.height/2,c.width);
  bg.addColorStop(0,"#0a0a20"); bg.addColorStop(1,"#020210");
  ctx.fillStyle=bg; ctx.fillRect(0,0,c.width,c.height);
  ctx.font="10px monospace"; ctx.textAlign="right";
  for(var d=0;d<=MAX_D;d++){
    var y=(d-MAX_D/2)*25, p=project(0,y,0), v=20+Math.floor(d*200/MAX_D);
    ctx.fillStyle="rgb("+v+","+v+","+(v+20)+")";
    ctx.fillText("L"+d+(d===0?" base":d>=MAX_D?" abstract":""),c.width-16,p.y);
  }
  projected=nodes.map(function(n){var p=project(n.x,n.y,n.z);return {n:n,px:p.x,py:p.y,ps:p.s}});
  projected.sort(function(a,b){return a.ps-b.ps});
  ctx.lineWidth=0.5;
  E.forEach(function(e){
    var si=nm[e.s],ti=nm[e.t]; if(si===undefined||ti===undefined)return;
    var a=project(nodes[si].x,nodes[si].y,nodes[si].z), b=project(nodes[ti].x,nodes[ti].y,nodes[ti].z);
    ctx.globalAlpha=e.opacity*0.5; ctx.strokeStyle=toR(e.color);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  ctx.globalAlpha=1;
  projected.forEach(function(p){
    var n=p.n, r=Math.max(1.5,n.size*1.2*p.ps);
    ctx.beginPath(); ctx.arc(p.px,p.py,r*1.6,0,Math.PI*2); ctx.fillStyle=toRA(n.color,0.12); ctx.fill();
    ctx.beginPath(); ctx.arc(p.px,p.py,r,0,Math.PI*2); ctx.fillStyle=toR(n.color); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.15)"; ctx.lineWidth=0.3; ctx.stroke();
  });
  cam.rotY+=0.001;
  requestAnimationFrame(render);
}
var tip=document.createElement("div");
tip.style.cssText="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(8,8,28,0.9);color:#dde;padding:6px 14px;border-radius:6px;font-size:11px;border:1px solid #2a2a40;pointer-events:none;opacity:0;z-index:20";
document.body.appendChild(tip);
function updateHover(e){
  var best=null,bd=999;
  for(var i=0;i<projected.length;i++){
    var p=projected[i], dx=p.px-e.clientX, dy=p.py-e.clientY, d=Math.sqrt(dx*dx+dy*dy);
    if(d<15&&d<bd){bd=d;best=p;}
  }
  if(best){
    var n=best.n, dl=n.depth===0?"base":n.depth>=MAX_D?"abstract":"L"+n.depth;
    tip.style.opacity=1; tip.textContent=n.id+" | "+n.domain+" | "+dl+" | pop:"+n.pop+" | deg:"+n.deg;
  }else{tip.style.opacity=0;}
}
render();
</script></body></html>
